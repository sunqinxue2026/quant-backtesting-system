[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtesting-system"
version = "0.1.0"
description = "Daily stock data processing and backtesting system"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "SQLAlchemy>=2.0", "PyMySQL>=1.1", "matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
