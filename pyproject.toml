[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtesting-system-rewrite"
version = "0.1.0"
description = "分阶段开发的量化数据处理与回测系统"
requires-python = ">=3.10,<3.13"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
